# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

# Deploy when a new tag is pushed or manually triggered
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Rebuild the latest release every 3 hours so new Resident Advisor events
  # (imported at build time, see src/events.mjs) appear without anyone deploying
  schedule:
    - cron: "23 */3 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # keeps the schedule switched on (see below)

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scheduled runs rebuild the latest release tag, never unreleased commits on master
      - name: Use the latest release on scheduled runs
        if: github.event_name == 'schedule'
        run: git checkout "$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"

      # GitHub pauses schedules in public repos after 60 days without activity;
      # re-enabling the workflow from each scheduled run keeps it going
      - name: Keep the schedule switched on
        if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/static.yaml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v2
    
      - name: Install and Build
        run: npm install && npm run build

      - name: Verify build
        run: npm test
      
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
